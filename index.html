<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Закупи для Ані</title>
<meta name="theme-color" content="#faf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Закупи">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#faf7f1;--card:#fff;--ink:#292823;--muted:#77736a;--line:#ebe5d9;--dark:#343431;--green:#3d7a52;--red:#b8432f;--soft:#f1ece2;--r:22px}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#22221f;--ink:#f1eee7;--muted:#a9a497;--line:#34332e;--dark:#f1eee7;--green:#7fc29b;--red:#ff8f78;--soft:#2b2a26}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(120px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header b{font-size:19px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;min-width:44px;height:40px;padding:0 12px;font-size:18px}
.hero{position:relative;height:92px;border-radius:20px;overflow:hidden;margin-bottom:6px;background:#ddd url(hero.jpg) center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.6) 60%,rgba(255,255,255,0))}
.hero div{position:relative;z-index:1;padding:13px 18px;color:#292823}
.hero p{margin:0;font-size:13px;color:#555}
.hero strong{display:block;font-size:32px;letter-spacing:-.5px;line-height:1.15}
.neg strong{color:#a3321f}
.status{font-size:12px;color:var(--muted);margin:0 4px 4px;min-height:16px}
.status.err{color:var(--red);font-weight:600}
.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.month small{color:var(--muted);font-size:13px}
.month small .in{font-weight:600}
.month h1{margin:0;font-size:22px}
.arrows{display:flex;gap:8px}
.cats{display:grid;gap:10px}
.cat{position:relative;height:122px;border:0;border-radius:20px;overflow:hidden;background:#8a8478 center/cover;color:#fff;text-align:left;padding:0;width:100%}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 65%)}
.cat.on{outline:3px solid var(--dark);outline-offset:2px}
.cat span{position:absolute;z-index:1;left:16px;right:14px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cat b{font-size:20px;display:block;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.cat i{font-style:normal;font-size:17px;font-weight:600;background:rgba(255,255,255,.93);color:#292823;border-radius:99px;padding:3px 12px;white-space:nowrap}
.cat .hid{font-size:12px;opacity:.85}
.hist{margin-top:22px;background:var(--card);border-radius:20px;padding:16px 18px;border:1px solid var(--line)}
.hist h2{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.chip{border:0;background:var(--soft);border-radius:99px;padding:4px 10px;font-size:13px}
.day{color:var(--muted);font-size:13px;margin:14px 0 2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:13px}
.row b{white-space:nowrap}
.in{color:var(--green)}
.empty{color:var(--muted);padding:10px 0}
.fab{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:0;background:var(--dark);color:var(--bg);font-size:38px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.big{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;font-size:18px;font-weight:600;text-align:left;margin-bottom:10px}
.big small{display:block;font-weight:400;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:17px}
input.amount{font-size:28px;font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px}
.picks button.on{background:var(--dark);color:var(--bg);border-color:var(--dark)}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:600;background:var(--dark);color:var(--bg)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-weight:600;margin-top:10px}
.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 4px;font-size:17px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .th{width:56px;height:56px;border-radius:12px;background:#8a8478 center/cover;flex:none}
.mrow .nm{flex:1;min-width:0}
.mrow .nm small{display:block;color:var(--muted)}
.mrow button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;flex:none}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:14px;padding:12px;margin:10px 0}
.gate{padding-top:12vh;text-align:center}
.gate p{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script type="module">
import * as C from "./core.js";

const LS = { key: "tz_key", token: "tz_token", cache: "tz_cache" };
const ls = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
const $app = document.getElementById("app"), $layer = document.getElementById("layer");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmtDay = (s) => new Date(s + "T12:00:00").toLocaleDateString("uk-UA", { day: "numeric", month: "long", weekday: "short" });

// Ключ береться з посилання (#k=...) і запам'ятовується на цьому пристрої.
function readKeyFromHash() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
  if (m) { ls.set(LS.key, m[1]); history.replaceState(null, "", location.pathname); }
}
readKeyFromHash();

const state = {
  key: ls.get(LS.key),
  token: ls.get(LS.token),
  data: null, sha: null,
  month: today().slice(0, 7),
  filter: null,
  status: "", statusErr: false,
};
const isEditor = () => Boolean(state.token);
const catById = (id) => state.data.categories.find((c) => c.id === id);

function setStatus(text, err = false) { state.status = text; state.statusErr = err; const el = document.getElementById("status"); if (el) { el.textContent = text; el.className = "status" + (err ? " err" : ""); } }

async function load() {
  setStatus("Оновлюю…");
  try {
    const r = await C.loadRemote(state.key, state.token);
    state.data = r.data; state.sha = r.sha;
    ls.set(LS.cache, JSON.stringify(r.data));
    state.status = "Оновлено о " + new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }); state.statusErr = false;
  } catch (e) {
    const cached = ls.get(LS.cache);
    if (cached && !/не підходить/.test(e.message)) { state.data = JSON.parse(cached); state.status = "Немає зв'язку — показано збережене на телефоні. " + e.message; state.statusErr = true; }
    else { renderGate(e.message); return; }
  }
  render();
}

function renderGate(msg = "") {
  $app.innerHTML = `<div class="gate"><h1>Закупи для Ані</h1>
    <p>${msg ? esc(msg) + "<br>" : ""}Відкрий застосунок за посиланням, яке тобі надіслали, або встав його сюди.</p>
    <input id="link" placeholder="Встав посилання" autocomplete="off">
    <div class="actions"><button class="btn" id="go">Відкрити</button></div></div>`;
  document.getElementById("go").onclick = () => {
    const m = document.getElementById("link").value.match(/k=([A-Za-z0-9_-]{43})/);
    if (!m) { alert("У посиланні немає ключа. Скопіюй посилання повністю."); return; }
    ls.set(LS.key, m[1]); state.key = m[1]; load();
  };
}

function render() {
  const d = state.data;
  const balance = C.calculateBalance(d.entries);
  const sum = C.summarizeMonth(d.entries, state.month);
  const cats = C.categoriesForMonth(d.categories, sum.byCategory);
  let list = C.entriesOfMonth(d.entries, state.month);
  if (state.filter) list = list.filter((e) => e.categoryId === state.filter);
  list.sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  let lastDay = "", rows = "";
  for (const e of list) {
    if (e.date !== lastDay) { rows += `<div class="day">${esc(fmtDay(e.date))}</div>`; lastDay = e.date; }
    const title = e.type === "income" ? "Отримала гроші" : (catById(e.categoryId)?.name ?? "Закупи");
    rows += `<button class="row" data-entry="${esc(e.id)}" ${isEditor() ? "" : "disabled"}><span>${esc(title)}${e.note ? `<small>${esc(e.note)}</small>` : ""}</span>
      <b class="${e.type === "income" ? "in" : ""}">${e.type === "income" ? "+" : "−"}${C.formatPln(e.amountGrosz, { sign: false })}</b></button>`;
  }
  const filterName = state.filter ? catById(state.filter)?.name : "";
  $app.innerHTML = `
  <header><b>Закупи для Ані</b><button class="iconbtn" id="menu" aria-label="Меню">•••</button></header>
  <section class="hero ${balance < 0 ? "neg" : ""}"><div><p>${balance < 0 ? "Мій баланс · витратила більше, ніж отримала" : "Мій баланс"}</p><strong>${C.formatPln(balance)}</strong></div></section>
  <div id="status" class="status${state.statusErr ? " err" : ""}">${esc(state.status)}</div>
  <div class="month"><div><small>Закупи ${C.formatPln(sum.purchases, { sign: false })}${sum.income ? ` · отримано <span class="in">${C.formatPln(sum.income, { sign: false })}</span>` : ""}</small><h1>${C.monthLabel(state.month)}</h1></div>
    <div class="arrows"><button class="iconbtn" id="prev" aria-label="Попередній місяць">‹</button><button class="iconbtn" id="next" aria-label="Наступний місяць">›</button></div></div>
  <section class="cats">${cats.map((c) => `<button class="cat ${state.filter === c.id ? "on" : ""}" data-cat="${esc(c.id)}" style="background-image:url('${esc(C.imageUrl(c.image))}')">
    <span><span style="position:static;display:block"><b>${esc(c.name)}</b>${c.hidden ? `<div class="hid">прихована</div>` : ""}</span><i>${C.formatPln(sum.byCategory[c.id] ?? 0, { sign: false })}</i></span></button>`).join("")}</section>
  <section class="hist"><h2>Історія ${state.filter ? `<button class="chip" id="unfilter">${esc(filterName)} ✕</button>` : ""}</h2>
    ${rows || `<div class="empty">За цей місяць записів немає</div>`}</section>
  ${isEditor() ? `<button class="fab" id="add" aria-label="Новий запис">+</button>` : ""}`;

  document.getElementById("prev").onclick = () => { state.month = C.shiftMonth(state.month, -1); state.filter = null; render(); };
  document.getElementById("next").onclick = () => { state.month = C.shiftMonth(state.month, 1); state.filter = null; render(); };
  document.getElementById("menu").onclick = openMenu;
  document.getElementById("unfilter")?.addEventListener("click", () => { state.filter = null; render(); });
  document.getElementById("add")?.addEventListener("click", openAddChoice);
  $app.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => { state.filter = state.filter === b.dataset.cat ? null : b.dataset.cat; render(); document.querySelector(".hist").scrollIntoView({ behavior: "smooth" }); }));
  $app.querySelectorAll("[data-entry]").forEach((b) => (b.onclick = () => isEditor() && openEntryForm(d.entries.find((e) => e.id === b.dataset.entry))));
}

// ---------- Аркуші ----------
function sheet(html) {
  $layer.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog">${html}</div></div>`;
  $layer.querySelector(".sheet-bg").onclick = (ev) => { if (ev.target.classList.contains("sheet-bg")) close(); };
  return $layer.querySelector(".sheet");
}
function close() { $layer.innerHTML = ""; }
const closeBtn = `<button class="iconbtn" data-close aria-label="Закрити">✕</button>`;
function wireClose(el) { el.querySelectorAll("[data-close]").forEach((b) => (b.onclick = close)); }

async function save(op, btn, errEl) {
  btn.disabled = true; const t = btn.textContent; btn.textContent = "Зберігаю…"; errEl.textContent = "";
  try {
    const r = await C.commitOp(op, state.key, state.token);
    state.data = r.data; state.sha = r.sha; ls.set(LS.cache, JSON.stringify(r.data));
    state.status = "Збережено о " + new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }); state.statusErr = false;
    render(); return true;
  } catch (e) {
    errEl.textContent = "Не збережено. " + (e instanceof TypeError ? "Немає зв'язку з інтернетом. Спробуй ще раз" : e.message);
    btn.disabled = false; btn.textContent = t; return false;
  }
}

function openAddChoice() {
  const el = sheet(`<h3>Новий запис ${closeBtn}</h3>
    <button class="big" data-t="income">💶 Отримала гроші<small>Аня переказала або дала гроші</small></button>
    <button class="big" data-t="purchase">🛒 Закупи<small>Що купила і на яку суму</small></button>`);
  wireClose(el);
  el.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => openEntryForm({ type: b.dataset.t })));
}

function openEntryForm(entry) {
  const isNew = !entry.id;
  let type = entry.type, catId = entry.categoryId ?? null;
  const visibleCats = state.data.categories.filter((c) => !c.hidden || c.id === catId).sort((a, b) => a.order - b.order);
  const el = sheet(`<h3>${type === "income" ? "Отримала гроші" : "Закупи"} ${closeBtn}</h3>
    <label for="f-amount">Сума, zł</label><input id="f-amount" class="amount" inputmode="decimal" placeholder="0,00" value="${entry.amountGrosz ? C.formatPln(entry.amountGrosz, { sign: false }).replace(/\s|zł/g, "").replace(/ /g, "") : ""}">
    ${type === "purchase" ? `<label>Категорія</label><div class="picks">${visibleCats.map((c) => `<button data-c="${esc(c.id)}" class="${c.id === catId ? "on" : ""}">${esc(c.name)}</button>`).join("")}</div>` : ""}
    <label for="f-date">Дата</label><input id="f-date" type="date" value="${esc(entry.date ?? today())}">
    <label for="f-note">Примітка (не обов'язково)</label><input id="f-note" value="${esc(entry.note ?? "")}" placeholder="${type === "income" ? "Напр.: Аня скинула на карту" : "Напр.: Lidl"}">
    <div class="err" id="f-err" role="alert"></div>
    <div class="actions">${isNew ? "" : `<button class="btn danger" id="f-del">Видалити</button>`}<button class="btn" id="f-save">Зберегти</button></div>`);
  wireClose(el);
  el.querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => { catId = b.dataset.c; el.querySelectorAll("[data-c]").forEach((x) => x.classList.toggle("on", x === b)); }));
  const err = el.querySelector("#f-err");
  if (isNew) setTimeout(() => el.querySelector("#f-amount").focus(), 50);
  el.querySelector("#f-save").onclick = async (ev) => {
    let amountGrosz;
    try { amountGrosz = C.toGrosz(el.querySelector("#f-amount").value); } catch (e) { err.textContent = e.message; return; }
    if (type === "purchase" && !catId) { err.textContent = "Обери категорію"; return; }
    const data = { id: entry.id ?? C.newId(), type, amountGrosz, date: el.querySelector("#f-date").value, categoryId: catId, note: el.querySelector("#f-note").value.trim() };
    if (await save({ kind: isNew ? "addEntry" : "updateEntry", entry: data }, ev.currentTarget, err)) close();
  };
  el.querySelector("#f-del")?.addEventListener("click", () => {
    const what = `${type === "income" ? "Отримала гроші" : catById(catId)?.name ?? "Закупи"}, ${C.formatPln(entry.amountGrosz, { sign: false })}, ${fmtDay(entry.date)}`;
    const c = sheet(`<h3>Видалити запис?</h3><p>${esc(what)}</p><p class="note">Видалений запис не повернути.</p><div class="err" id="d-err"></div>
      <div class="actions"><button class="btn ghost" id="d-no">Скасувати</button><button class="btn danger" id="d-yes">Так, видалити</button></div>`);
    c.querySelector("#d-no").onclick = () => openEntryForm(entry);
    c.querySelector("#d-yes").onclick = async (ev) => { if (await save({ kind: "deleteEntry", id: entry.id }, ev.currentTarget, c.querySelector("#d-err"))) close(); };
  });
}

function openMenu() {
  const el = sheet(`<h3>Меню ${closeBtn}</h3><div class="menu">
    <button id="m-reload">🔄 Оновити дані</button>
    ${isEditor() ? `<button id="m-cats">🗂 Керувати категоріями</button>` : ""}
    <button id="m-share">🔗 Скопіювати посилання для перегляду</button>
    <button id="m-edit">${isEditor() ? "🔓 Керування увімкнено на цьому телефоні" : "🔒 Увімкнути керування"}</button>
    </div><p class="note">Посилання для перегляду відкриває всі записи. Надсилай його лише Ані й Міші.</p>`);
  wireClose(el);
  el.querySelector("#m-reload").onclick = () => { close(); load(); };
  el.querySelector("#m-cats")?.addEventListener("click", openCategories);
  el.querySelector("#m-share").onclick = async () => {
    const link = `${location.origin}${location.pathname}#k=${state.key}`;
    try { await navigator.clipboard.writeText(link); alert("Посилання скопійовано"); } catch { prompt("Скопіюй посилання:", link); }
  };
  el.querySelector("#m-edit").onclick = openEditorSetup;
}

function openEditorSetup() {
  const el = sheet(`<h3>Керування ${closeBtn}</h3>
    ${isEditor() ? `<p>На цьому телефоні можна додавати, змінювати й видаляти записи.</p>
      <div class="actions"><button class="btn ghost" id="e-off">Вимкнути керування тут</button></div>`
    : `<p>Встав ключ керування з GitHub. Він зберігається лише на цьому телефоні. Нікому його не пересилай.</p>
      <label for="e-token">Ключ керування</label><input id="e-token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
      <div class="err" id="e-err"></div><div class="actions"><button class="btn" id="e-on">Увімкнути</button></div>`}`);
  wireClose(el);
  el.querySelector("#e-off")?.addEventListener("click", () => { ls.del(LS.token); state.token = null; close(); render(); });
  el.querySelector("#e-on")?.addEventListener("click", async (ev) => {
    const tok = el.querySelector("#e-token").value.trim(), err = el.querySelector("#e-err");
    ev.currentTarget.disabled = true; err.textContent = "";
    if (await C.checkToken(tok).catch(() => false)) { ls.set(LS.token, tok); state.token = tok; close(); load(); }
    else { err.textContent = "Ключ не підходить або не має дозволу на зміну."; ev.currentTarget.disabled = false; }
  });
}

function openCategories() {
  const list = state.data.categories.slice().sort((a, b) => a.order - b.order);
  const el = sheet(`<h3>Категорії ${closeBtn}</h3>
    ${list.map((c, i) => `<div class="mrow"><div class="th" style="background-image:url('${esc(C.imageUrl(c.image))}')"></div>
      <div class="nm"><b>${esc(c.name)}</b>${c.hidden ? "<small>прихована</small>" : ""}</div>
      <button data-up="${esc(c.id)}" ${i === 0 ? "disabled" : ""} aria-label="Вище">↑</button><button data-down="${esc(c.id)}" ${i === list.length - 1 ? "disabled" : ""} aria-label="Нижче">↓</button>
      <button data-ed="${esc(c.id)}" aria-label="Змінити">✎</button></div>`).join("")}
    <div class="err" id="c-err"></div>
    <div class="actions"><button class="btn" id="c-new">+ Нова категорія</button></div>`);
  wireClose(el);
  const err = el.querySelector("#c-err");
  const move = async (id, delta, btn) => { if (await save({ kind: "moveCategory", id, delta }, btn, err)) openCategories(); };
  el.querySelectorAll("[data-up]").forEach((b) => (b.onclick = () => move(b.dataset.up, -1, b)));
  el.querySelectorAll("[data-down]").forEach((b) => (b.onclick = () => move(b.dataset.down, 1, b)));
  el.querySelectorAll("[data-ed]").forEach((b) => (b.onclick = () => openCategoryForm(catById(b.dataset.ed))));
  el.querySelector("#c-new").onclick = () => openCategoryForm({});
}

async function compressImage(file) {
  if (!file.type.startsWith("image/")) throw new Error("Це не фото");
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  const url = cv.toDataURL("image/jpeg", 0.8);
  if (url.length > 1.4e6) throw new Error("Фото завелике навіть після стиснення");
  return url.split(",")[1];
}

function openCategoryForm(cat) {
  const isNew = !cat.id;
  let photo = null;
  const el = sheet(`<h3>${isNew ? "Нова категорія" : "Категорія"} ${closeBtn}</h3>
    <label for="k-name">Назва</label><input id="k-name" value="${esc(cat.name ?? "")}">
    <label>Фото</label><div class="mrow" style="border:0"><div class="th" id="k-th" style="background-image:url('${esc(C.imageUrl(cat.image))}')"></div>
      <input id="k-file" type="file" accept="image/*" style="flex:1"></div>
    ${isNew ? "" : `<label><input id="k-hid" type="checkbox" style="width:auto" ${cat.hidden ? "checked" : ""}> Приховати (старі записи й підсумки залишаться)</label>`}
    <div class="err" id="k-err"></div>
    <div class="actions"><button class="btn ghost" id="k-back">Назад</button><button class="btn" id="k-save">Зберегти</button></div>`);
  wireClose(el);
  const err = el.querySelector("#k-err");
  el.querySelector("#k-back").onclick = openCategories;
  el.querySelector("#k-file").onchange = async (ev) => {
    err.textContent = "";
    try { photo = await compressImage(ev.target.files[0]); el.querySelector("#k-th").style.backgroundImage = `url(data:image/jpeg;base64,${photo})`; }
    catch (e) { photo = null; err.textContent = e.message; }
  };
  el.querySelector("#k-save").onclick = async (ev) => {
    const btn = ev.currentTarget, id = cat.id ?? C.newId();
    const category = { id, name: el.querySelector("#k-name").value, hidden: el.querySelector("#k-hid")?.checked ?? false };
    if (!category.name.trim()) { err.textContent = "Вкажи назву категорії"; return; }
    if (photo) {
      const path = `photos/${id}-${Date.now()}.jpg`;
      btn.disabled = true; btn.textContent = "Завантажую фото…";
      try { await C.uploadPhoto(path, photo, state.token); category.image = path; }
      catch (e) { err.textContent = "Не збережено. " + e.message; btn.disabled = false; btn.textContent = "Зберегти"; return; }
    }
    if (await save({ kind: "saveCategory", category }, btn, err)) openCategories();
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("hashchange", () => { readKeyFromHash(); state.key = ls.get(LS.key); if (state.key) load(); });
if (state.key) {
  const cached = ls.get(LS.cache);
  if (cached) { try { state.data = JSON.parse(cached); render(); } catch {} }
  load();
} else renderGate();
</script>
